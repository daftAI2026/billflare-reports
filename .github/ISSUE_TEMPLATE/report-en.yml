# [INPUT]: 公开来源、可选别名和金额、产品、后续来源与事实摘要
# [OUTPUT]: 带 pending-review 标签的英文公开报告 Issue
# [POS]: 英文收集表单；GitHub 将答案写入公开 Issue 正文。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Cloudflare billing report (English)
description: Submit a public, source-linked billing report for review.
title: "Cloudflare billing report"
labels:
  - pending-review
body:
  - type: markdown
    attributes:
      value: |
        ## This report will be public

        Anyone can read this issue. The `pending-review` label does not mean the report is verified or included in Billflare.

        Provide public HTTPS sources and plain factual text. Do not add Markdown images, embedded HTML, scripts, `@mentions`, or private links. Do not include credentials, account identifiers, email, payment details, private billing pages, private messages, or unredacted screenshots.
  - type: input
    id: original-source
    attributes:
      label: Original public source URL
      description: Use a public HTTPS page that supports this report. Do not use a private dashboard or a URL with credentials or secret query parameters.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: reporter-alias
    attributes:
      label: Reporter alias (optional)
      description: This alias will be public. It is user-supplied and does not verify identity. Do not enter contact details.
      placeholder: Optional public alias
    validations:
      required: false
  - type: dropdown
    id: cloudflare-product
    attributes:
      label: Cloudflare product
      description: Choose the product named in the source.
      options:
        - Workers
        - Durable Objects
        - R2
        - D1
        - Workers AI
        - Containers
        - Browser Rendering
        - Smart Shield Argo
        - Other
    validations:
      required: true
  - type: input
    id: reported-amount
    attributes:
      label: Reported amount and currency (optional)
      description: Keep the amount as reported. Include currency and billing period, such as USD 432.10/month. Do not convert it.
      placeholder: USD 432.10/month
    validations:
      required: false
  - type: textarea
    id: follow-up-sources
    attributes:
      label: Public sources for later updates (optional)
      description: Add one public URL per line. Do not paste private account links or secret query parameters.
      placeholder: https://
    validations:
      required: false
  - type: textarea
    id: factual-summary
    attributes:
      label: Factual summary
      description: State what the source says, what changed, and what remains unknown. Separate the report from any interpretation.
      placeholder: Describe the reported charge and cite the public source.
    validations:
      required: true
  - type: checkboxes
    id: public-consent
    attributes:
      label: Public submission consent
      description: Required to create a public issue.
      options:
        - label: I agree that the submitted source, alias, product, amount, update links, and summary may be published in this public repository. I removed private information. I understand this report is not verified here and is not automatically added to Billflare.
          required: true
